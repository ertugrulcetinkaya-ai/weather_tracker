[project]
name = "weather-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for Weather Tracker."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.vercel]
entrypoint = "app.main:app"
