services:
  - type: web
    name: weather-tracker-api
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*' --no-access-log"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: WEATHER_ENFORCE_HTTPS
        value: "true"
      - key: WEATHER_API_RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: WEATHER_CORS_ORIGINS
        value: ""
